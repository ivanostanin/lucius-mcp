version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels: ["dependencies", "python"]
    groups:
      python-development:
        dependency-type: development
      python-production:
        dependency-type: production
    reviewers:
      - "ivanostanin"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels: ["dependencies", "github-actions"]
    groups:
      github-actions:
        patterns: ["*"]
    reviewers:
      - "ivanostanin"

  - package-ecosystem: "docker"
    directory: "/deployment"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels: ["dependencies", "docker"]
    groups:
      docker-dependencies:
        patterns: ["*"]
    reviewers:
      - "ivanostanin"
